    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f0f0;
        }
        .main-container {
            max-width: 420px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .logo-container {
            border-radius: 50%;
            border: 4px solid #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            width: 110px;
            height: 110px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #f5d300, #ffc400);
            position: relative;
        }
        .cta-button {
            background-color: #0088cc;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 10px rgba(0, 136, 204, 0.4);
            border-radius: 12px;
        }
        .cta-button:hover {
            transform: scale(1.02);
        }
        .countdown-box {
            background-color: #333;
            color: white;
            padding: 0.3rem 0.25rem;
            border-radius: 8px;
            min-width: 60px;
        }
        .countdown-number {
            font-size: 1.5rem;
            font-weight: 900;
            line-height: 1;
        }
        .accuracy-highlight {
            background-color: #f7f3e8;
            border: 2px solid #ffcc00;
            border-radius: 10px;
            padding: 1rem;
        }
        .verify-badge {
            position: absolute;
            bottom: 3px; 
            right: 3px;  
            background-color: #3b82f6; 
            color: white;
            border-radius: 50%;
            padding: 3px;
            font-size: 14px;
            border: 2px solid #fff; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-start min-h-screen py-4 px-4 bg-white">

    <div class="w-full text-center main-container p-4 bg-white">

        <!-- Logo Section -->
        <div class="mx-auto flex justify-center mb-4">
            <div class="logo-container">
                <img src="logo.png" class="w-full h-full object-cover p-2" alt="Trader Success Logo" onerror="this.onerror=null; this.src='https://placehold.co/110x110/ffcc00/000?text=TS';" />
                <span class="verify-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                    </svg>
                </span>
            </div>
        </div>
        
        <p class="text-lg font-medium text-gray-700 mt-1">
            Recover Your Binary Losses With
        </p>

        <div class="flex justify-center mt-1 mb-4">
            <span class="text-yellow-600 text-2xl">👇</span>
        </div>

        <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight relative inline-block pb-1">
            TRADER SUCCESS
            <span class="absolute bottom-0 left-0 w-full h-1 bg-yellow-400"></span>
        </h1>

        <!-- Primary CTA Button -->
        <a href="https://t.me/+BWugohkYpowzMjI1"
           target="_blank"
           id="joinButton"
           class="cta-button text-white font-extrabold py-3 px-6 text-lg uppercase tracking-wider w-full mt-4 mb-4 inline-flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 rotate-45" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
            JOIN FREE TELEGRAM
        </a>
        
        <!-- Countdown Timer -->
        <div class="flex justify-center space-x-2 mt-2 text-center">
            <div class="countdown-box">
                <span class="countdown-number" id="days">00</span>
                <span class="text-xs font-semibold block uppercase">DAYS</span>
            </div>
            <span class="text-2xl font-extrabold text-gray-800">:</span>
            <div class="countdown-box">
                <span class="countdown-number" id="hours">00</span>
                <span class="text-xs font-semibold block uppercase">HOURS</span>
            </div>
            <span class="text-2xl font-extrabold text-gray-800">:</span>
            <div class="countdown-box">
                <span class="countdown-number" id="minutes">00</span>
                <span class="text-xs font-semibold block uppercase">MINUTES</span>
            </div>
            <span class="text-2xl font-extrabold text-gray-800">:</span>
            <div class="countdown-box">
                <span class="countdown-number" id="seconds">00</span>
                <span class="text-xs font-semibold block uppercase">SECONDS</span>
            </div>
        </div>

        <div class="mt-3 h-3"></div> 
        
        <p class="text-lg font-bold text-gray-800 mt-4 mb-2">
            Join My Telegram & Become Profitable Loss Free
        </p>
        <div class="flex justify-center mb-4">
             <span class="text-green-600 text-2xl">✅</span>
        </div>

        <div class="accuracy-highlight mx-auto w-full">
            <p class="text-xl font-extrabold text-gray-900 uppercase">
                GET 95-99% ACCURATE 
            </p>
             <p class="text-xl font-extrabold text-gray-900 uppercase">
                SIGNALS DAILY <span class="text-yellow-600 ml-1">💰</span>
            </p>
        </div>
    </div>

    <script>
        const REDIRECT_URL = "https://t.me/+BWugohkYpowzMjI1";
        const REDIRECT_DELAY_MS = 500000; 

        function updateTime() {
            const now = new Date();
            document.getElementById('days').textContent = '00';
            document.getElementById('hours').textContent = String(now.getHours() % 12).padStart(2, '0');
            document.getElementById('minutes').textContent = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('seconds').textContent = String(now.getSeconds()).padStart(2, '0');
        }

        function startRedirectCountdown() {
            const countdownInterval = setTimeout(() => {
                console.log("Auto-redirecting to Telegram...");
                
                // Track Meta Events on Auto-Redirect
                if (typeof fbq === 'function') {
                    fbq('track', 'Lead', { method: 'AutoRedirect' });
                    fbq('trackCustom', 'SUBSCRIBE', { method: 'AutoRedirect' });
                }
                
                window.location.href = REDIRECT_URL;
            }, REDIRECT_DELAY_MS);

            document.querySelectorAll('a[href^="https://t.me/"]').forEach(link => {
                link.addEventListener('click', (e) => {
                    clearTimeout(countdownInterval); 
                    console.log("Manual click detected.");
                    
                    // Track Meta Events on Manual Click
                    if (typeof fbq === 'function') {
                        fbq('track', 'Lead', { method: 'ManualClick', url: e.currentTarget.href });
                        fbq('trackCustom', 'SUBSCRIBE', { method: 'ManualClick' });
                    }
                });
            });
            
            setInterval(updateTime, 1000);
            updateTime(); 
        }

        document.addEventListener('DOMContentLoaded', startRedirectCountdown);
    </script>
</body>
</html>
